name = "url-shortener"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve dashboard static files from the built Vite output
[assets]
directory = "./dashboard/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "url-shortener"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "url-shortener-images"

[vars]
SHORT_BASE_URL = "https://go.logan.tw"
R2_BASE_URL = "https://r2.go.logan.tw"

# Set secrets via: wrangler secret put API_KEY
