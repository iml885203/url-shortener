name = "url-shortener"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "go.dotw.me", custom_domain = true }
]

# Serve dashboard static files from the built Vite output
[assets]
directory = "./dashboard/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "url-shortener"
database_id = "624589f3-8ea6-4dc0-aa9f-e6fc7f849aed"

[[kv_namespaces]]
binding = "KV"
id = "efa24714fbc74f20876627faf727244e"

[[r2_buckets]]
binding = "R2"
bucket_name = "url-shortener-images"

[vars]
SHORT_BASE_URL = "https://go.dotw.me"
R2_BASE_URL = "https://r2-go.dotw.me"
DEFAULT_OG_IMAGE = "https://go.dotw.me/og-default.svg"

# Set secrets via: wrangler secret put API_KEY
