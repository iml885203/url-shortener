<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">URL Shortener architecture</title>
  <desc id="desc">Visitors follow short links through the Redirect Worker, which reads links from D1, caches them in KV and records clicks in D1. The Dashboard Worker serves the dashboard and authenticated API, manages links in D1 and KV, and uploads preview images to R2. Optional OpenID Connect provides sign-in for the dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#14213b}
    .heading {font-size:21px;font-weight:650}
    .detail {font-size:17px;fill:#475569}
    .box {fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    .worker {fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
    .edge {fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="650" rx="20" fill="#f8fafc"/>
  <rect x="40" y="90" width="240" height="100" rx="12" class="box"/>
  <text x="160" y="133" text-anchor="middle" class="heading">Link visitors</text>
  <text x="160" y="161" text-anchor="middle" class="detail">Open a short URL</text>
  <rect x="400" y="90" width="300" height="100" rx="12" class="worker"/>
  <text x="550" y="133" text-anchor="middle" class="heading">Redirect Worker</text>
  <text x="550" y="161" text-anchor="middle" class="detail">Redirects + click tracking</text>
  <rect x="40" y="330" width="240" height="100" rx="12" class="box"/>
  <text x="160" y="373" text-anchor="middle" class="heading">You</text>
  <text x="160" y="401" text-anchor="middle" class="detail">Manage your links</text>
  <rect x="400" y="330" width="300" height="100" rx="12" class="worker"/>
  <text x="550" y="373" text-anchor="middle" class="heading">Dashboard Worker</text>
  <text x="550" y="401" text-anchor="middle" class="detail">Web app + private API</text>
  <rect x="860" y="50" width="300" height="455" rx="16" class="box"/>
  <text x="1010" y="95" text-anchor="middle" class="heading">Cloudflare storage</text>
  <path d="M884 115H1136M884 245H1136M884 375H1136" stroke="#e2e8f0"/>
  <text x="892" y="162" class="heading">D1</text>
  <text x="892" y="194" class="detail">Links + click stats</text>
  <text x="892" y="292" class="heading">KV</text>
  <text x="892" y="324" class="detail">Redirect cache</text>
  <text x="892" y="422" class="heading">R2</text>
  <text x="892" y="454" class="detail">Social preview images</text>
  <path d="M280 140H400M280 380H400" class="edge"/>
  <path d="M700 140H860" class="edge"/>
  <text x="780" y="121" text-anchor="middle" class="detail">D1 + KV</text>
  <path d="M700 380H860" class="edge"/>
  <text x="780" y="360" text-anchor="middle" class="detail">D1 + KV + R2</text>
  <rect x="400" y="535" width="300" height="75" rx="12" class="box"/>
  <text x="550" y="580" text-anchor="middle" class="heading">OpenID Connect provider</text>
  <path d="M550 430V535" class="edge" stroke-dasharray="6 6"/>
  <text x="570" y="486" class="detail">Optional SSO</text>
</svg>
